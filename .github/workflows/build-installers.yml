name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x64
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Set version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then version="0.0.0-dev"; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build application bundle
        run: >-
          pyinstaller --noconfirm --clean --windowed --name ResumeStudio
          --collect-all streamlit --collect-all rendercv --collect-all typst
          --collect-all pydantic --collect-all pydantic_core
          --copy-metadata rendercv
          --paths src
          --hidden-import app_pages.cv_builder --hidden-import app_pages.cover_letter
          --hidden-import cv_builder.storage --hidden-import cv_builder.importing --hidden-import cv_builder.processes
          --hidden-import yaml --hidden-import pypdf --hidden-import docx
          --add-data "app.py${{ runner.os == 'Windows' && ';' || ':' }}."
          --add-data "app_pages${{ runner.os == 'Windows' && ';' || ':' }}app_pages"
          --add-data "src${{ runner.os == 'Windows' && ';' || ':' }}src"
          --add-data "assets${{ runner.os == 'Windows' && ';' || ':' }}assets"
          --add-data "prompts${{ runner.os == 'Windows' && ';' || ':' }}prompts"
          packaging/launcher.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION packaging/windows.iss
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist-installer
          app_path="dist/ResumeStudio.app"
          dmg_path="dist-installer/ResumeStudio-${APP_VERSION}-${{ matrix.artifact }}.dmg"
          signing_values=("$MACOS_CERTIFICATE_P12" "$MACOS_CERTIFICATE_PASSWORD" "$MACOS_SIGNING_IDENTITY" "$APPLE_API_KEY_P8_BASE64" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER_ID")
          configured_values=0
          for value in "${signing_values[@]}"; do
            if [[ -n "$value" ]]; then configured_values=$((configured_values + 1)); fi
          done
          if [[ "$configured_values" -ne 0 && "$configured_values" -ne "${#signing_values[@]}" ]]; then
            echo "Signing/notarization secrets are only partially configured; provide all six or none." >&2
            exit 1
          fi
          if [[ "$configured_values" -eq "${#signing_values[@]}" ]]; then
            certificate_path="$RUNNER_TEMP/resume-studio-certificate.p12"
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$certificate_path"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$api_key_path"
            keychain_path="$RUNNER_TEMP/resume-studio-signing.keychain-db"
            keychain_password="$(openssl rand -hex 20)"
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
            security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            security delete-keychain "$keychain_path"
          else
            echo "Apple signing/notarization secrets are not configured; building an unsigned macOS installer."
          fi
          hdiutil create -volname "Resume Studio" -srcfolder "$app_path" -ov -format UDZO "$dmg_path"
          if [[ "$configured_values" -eq "${#signing_values[@]}" ]]; then
            xcrun notarytool submit "$dmg_path" --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "$dmg_path"
            xcrun stapler validate "$dmg_path"
          fi
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps dist-installer
          cp -R dist/ResumeStudio/. AppDir/usr/bin/
          cp packaging/linux/ResumeStudio.desktop AppDir/usr/share/applications/
          cp assets/resume-studio-logo.svg AppDir/usr/share/icons/hicolor/scalable/apps/resume-studio.svg
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          ln -s usr/share/applications/ResumeStudio.desktop AppDir/ResumeStudio.desktop
          ln -s usr/share/icons/hicolor/scalable/apps/resume-studio.svg AppDir/resume-studio.svg
          curl -fsSL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "dist-installer/ResumeStudio-${APP_VERSION}-Linux.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeStudio-${{ matrix.artifact }}
          path: dist-installer/*
          if-no-files-found: error
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*
