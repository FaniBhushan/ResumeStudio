{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page %}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Resume Studio">
    <meta property="og:title" content="{{ page.meta.title | default(page.title, true) }}">
    <meta property="og:description" content="{{ page.meta.description | default(config.site_description, true) }}">
    {% if page.canonical_url %}
      <meta property="og:url" content="{{ page.canonical_url }}">
    {% endif %}
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.meta.title | default(page.title, true) }}">
    <meta name="twitter:description" content="{{ page.meta.description | default(config.site_description, true) }}">
  {% endif %}
  {% if page and page.is_homepage %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Resume Studio",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Windows, macOS, Linux",
        "url": "https://fanibhushan.github.io/ResumeStudio/",
        "downloadUrl": "https://github.com/FaniBhushan/ResumeStudio/releases",
        "description": "A free, open-source desktop CV and cover letter builder with optional AI-assisted ATS alignment review.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  {% endif %}
{% endblock %}
